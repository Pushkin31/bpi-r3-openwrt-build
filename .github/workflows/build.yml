name: Build OpenWrt Firmware (Build-Only)

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: OpenWrt git ref (tag/branch/commit), e.g. v24.10.0
        required: false
        default: 24.10.5
        type: string
      additional_packages:
        description: Additional package names for this build (space-separated)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/reusable-openwrt-build.yml
    with:
      publish_release: false
      openwrt_ref: ${{ inputs.openwrt_ref || '24.10.5' }}
      additional_packages: ${{ inputs.additional_packages }}
