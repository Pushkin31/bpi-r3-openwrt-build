name: Build OpenWrt ImageBuilder BPI-R3

on:
  workflow_call:
    inputs:
      publish_release:
        description: Publish GitHub Release after successful tests
        required: false
        default: false
        type: boolean
      openwrt_ref:
        description: OpenWrt version to use
        required: false
        default: 24.10.5
        type: string
      additional_packages:
        description: Additional package names for this build (space-separated)
        required: false
        default: ''
        type: string
      build_number:
        description: Custom build number override (optional)
        required: false
        type: string

jobs:
  build:
    name: Build firmware via ImageBuilder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 curl zstd

      - name: Download and setup ImageBuilder
        env:
          OPENWRT_REF: ${{ inputs.openwrt_ref }}
        run: |
          set -euo pipefail
          VERSION="$OPENWRT_REF"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid OpenWrt release: $VERSION"
            exit 1
          fi
          URL="https://downloads.openwrt.org/releases/${VERSION}/targets/mediatek/filogic/openwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.tar.zst"
          SHA_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/mediatek/filogic/sha256sums"

          wget "$URL" -O imagebuilder.tar.zst
          EXPECTED_SHA="$(wget -qO- "$SHA_URL" | awk -v file="$(basename "$URL")" '$2 == "*" file { print $1; exit }')"
          if [[ ! "$EXPECTED_SHA" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "ImageBuilder checksum is missing for $(basename "$URL")"
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA" imagebuilder.tar.zst | sha256sum -c -

          tar -I zstd -xf imagebuilder.tar.zst
          mv openwrt-imagebuilder-* imagebuilder


      - name: Prepare custom configuration files
        run: |
          set -euo pipefail
          # Any custom files you want to bake into the image can go here
          mkdir -p imagebuilder/files/etc/config
          # Example: If you have preconfigured files, copy them
          # cp -r files/* imagebuilder/files/

      - name: Build firmware
        env:
          ADDITIONAL_PACKAGES: ${{ inputs.additional_packages }}
        run: |
          set -euo pipefail
          CONFIG_FILE="$GITHUB_WORKSPACE/.config/config"
          test -f "$CONFIG_FILE"
          cd imagebuilder

          # Prevent OpenWrt's bundled OpenSSL from crashing when it tries to parse
          # Ubuntu 24.04's host /etc/ssl/openssl.cnf which contains unsupported modules
          export OPENSSL_CONF=/dev/null

          mapfile -t BASE_PACKAGES < <(
            awk '
              /^[[:space:]]*CONFIG_PACKAGE_[-A-Za-z0-9+._:@~]+=(y|m)([[:space:]]|$)/ {
                sub(/^[[:space:]]*CONFIG_PACKAGE_/, "")
                sub(/=(y|m).*/, "")
                print
              }
            ' "$CONFIG_FILE" | sort -u
          )
          if ((${#BASE_PACKAGES[@]} == 0)); then
            echo "No CONFIG_PACKAGE_* entries found in $CONFIG_FILE"
            exit 1
          fi

          NORMALIZED_ADDITIONAL_PACKAGES="${ADDITIONAL_PACKAGES//$'\r'/ }"
          NORMALIZED_ADDITIONAL_PACKAGES="${NORMALIZED_ADDITIONAL_PACKAGES//$'\n'/ }"
          NORMALIZED_ADDITIONAL_PACKAGES="${NORMALIZED_ADDITIONAL_PACKAGES//$'\t'/ }"
          read -r -a EXTRA_PACKAGES <<< "$NORMALIZED_ADDITIONAL_PACKAGES"
          for package in "${EXTRA_PACKAGES[@]}"; do
            if [[ ! "$package" =~ ^[-A-Za-z0-9+._:@~]+$ || "$package" == -* ]]; then
              echo "Invalid additional package name: $package"
              echo "Use space-separated package names such as: curl nano"
              exit 1
            fi
          done

          ALL_PACKAGES=("${BASE_PACKAGES[@]}" "${EXTRA_PACKAGES[@]}")
          PACKAGES="${ALL_PACKAGES[*]}"
          echo "Requested packages: $PACKAGES"

          # Resolve the package set before creating the firmware image. This fails
          # early for a typo or a package unavailable in the selected OpenWrt release.
          make manifest PROFILE="bananapi_bpi-r3" PACKAGES="$PACKAGES" STRIP_ABI=1 > package-manifest.txt

          make image PROFILE="bananapi_bpi-r3" PACKAGES="$PACKAGES" FILES="files"

      - name: Prepare artifacts
        env:
          OPENWRT_REF: ${{ inputs.openwrt_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp imagebuilder/bin/targets/mediatek/filogic/*bananapi_bpi-r3* artifacts/
          cp imagebuilder/bin/targets/mediatek/filogic/sha256sums artifacts/
          cp imagebuilder/package-manifest.txt artifacts/bananapi_bpi-r3.manifest

          {
            echo "OpenWrt firmware for Banana Pi BPI-R3 (ImageBuilder)"
            echo "OpenWrt version: $OPENWRT_REF"
            echo "Built on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Git commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > artifacts/release_notes.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-bpi-r3
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: openwrt-firmware-bpi-r3
          path: dist

      - name: Generate release metadata
        id: meta
        env:
          CUSTOM_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [ -n "$CUSTOM_BUILD_NUMBER" ]; then
            BUILD_NUM="$CUSTOM_BUILD_NUMBER"
          else
            BUILD_NUM="${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=bpi-r3-openwrt-imagebuilder-r${BUILD_NUM}a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "name=OpenWrt BPI-R3 ImageBuilder build #${BUILD_NUM}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: dist/release_notes.txt
          files: |
            dist/*bananapi_bpi-r3*
            dist/*.manifest
            dist/sha256sums
          fail_on_unmatched_files: true
